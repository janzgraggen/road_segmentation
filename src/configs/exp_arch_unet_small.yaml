defaults:
  - model: unet_small
  - writer: tensorboard 
  - metrics: metrics
  - datasets: image
  - dataloader: main
  - transforms: noisy
  - _self_
optimizer:
  _target_: torch.optim.Adam
  lr: 1e-3
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: ${trainer.epoch_len}
loss_function:
  _target_: src.loss.BinaryCrossEntropyLossWN
trainer:
  log_step: 50
  n_epochs:  20
  epoch_len: 100
  device_tensors: ["img", "labels"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: mps # device name or "auto"
  override: True # if True, will override the previous run with the same name
  monitor: "max inference_f1" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 5 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: ${trainer.n_epochs} # epochs for early stopping
  save_dir: "saved"
  seed: 8

experiment: 
  name: exp_arch_unet_large